<!-- Add language switcher button similar to other optionsbutton buttons -->
<button class="optionsbutton" id="button_languageSwitcher" onclick="toggle('languageSwitcher')">Language: <span id="currentLanguage">EN</span></button>

<!-- Language switcher dropdown, hide initially -->
<div id="languageSwitcher" style="display:none;">
  <button class="optionsbutton" onclick="changeLanguage('en')">English</button>
  <button class="optionsbutton" onclick="changeLanguage('ru')">[translate:Русский]</button>
</div>

<script>
  function toggle(id) {
    var el = document.getElementById(id);
    el.style.display = (el.style.display === 'none' || !el.style.display) ? '' : 'none';
  }

  function changeLanguage(lang) {
    if (window.i18n) {
      window.i18n.changeLanguage(lang);
      document.getElementById('currentLanguage').textContent = lang.toUpperCase();
    }
    toggle('languageSwitcher');
  }
</script>
